<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7c3aed">
<title>Wiskunde Avontuur · Admin</title>
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Baloo+2:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  /* the dashboard is a teacher tool read on a laptop, not a learner screen on a phone —
     it may use the whole width. At 840px every chapter's chips stacked into a tall
     column and the action buttons fell off the side. */
  .view.adm{max-width:min(1560px,94vw)}
  .adm-head{margin:4px 2px 14px}
  .adm-section{margin-bottom:16px}
  .adm-section h2{font-size:19px;margin-bottom:2px}
  .adm-strug{display:flex;flex-direction:column;margin-top:10px}
  .adm-srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
  .adm-srow:last-child{border-bottom:none}
  .adm-lhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
  .adm-tablewrap{overflow-x:auto;margin-top:10px}
  .adm-table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
  .adm-table th,.adm-table td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
  .adm-table th{color:var(--muted);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px}
  .adm-table .mono{font-family:var(--font-num);font-weight:700}
  /* stacked, not in a row: three side-by-side buttons ate 318px of table width that
     the round chips need, and rows are tall enough to hold them anyway */
  .adm-actions{display:flex;flex-direction:column;gap:5px;white-space:nowrap;width:min-content}
  .adm-inactive{color:var(--warn);font-weight:700}
  .pwset{color:var(--muted);font-weight:700}
  .pwreset{color:var(--bad);font-weight:700}
  .btn.danger{color:#fff;background:linear-gradient(180deg,#f76b96,var(--bad));box-shadow:0 8px 18px -6px var(--bad)}
  /* rounds open/close gating */
  .adm-qchap{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .adm-qchap:first-of-type{border-top:none}
  .adm-qchead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .adm-qctitle{font-family:var(--font-display);font-weight:600;font-size:16px}
  .adm-qcount{margin-left:2px}
  .adm-qcbtns{display:flex;gap:6px;margin-left:auto}
  .adm-qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
  .adm-qrow{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;background:#fbfaff}
  .adm-qrow.on{border-color:color-mix(in srgb,var(--good,#16a34a) 45%,white);background:color-mix(in srgb,var(--good,#16a34a) 8%,white)}
  .adm-qrow input{width:17px;height:17px;accent-color:var(--good,#16a34a);flex:none}
  .adm-qname{line-height:1.2}
  /* archived chapters — collapsed "📦 Argief" block, checkboxes inside still work */
  .adm-archive{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .adm-archive summary{cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:16px;list-style:none}
  .adm-archive summary::-webkit-details-marker{display:none}
  .adm-archive summary::before{content:"▸ ";display:inline-block;transition:transform .12s}
  .adm-archive[open] summary::before{transform:rotate(90deg)}
  .adm-archive summary .muted{font-weight:600;font-size:12.5px}
  .adm-archive-body{margin-top:4px}
  .adm-archive-body .adm-qchap:first-of-type{border-top:1px solid var(--line)}
  /* learner table: weekly/all-time numbers + round-status chips, grouped per chapter */
  .adm-lbtns{display:flex;gap:6px;margin-left:auto}
  .adm-table td.num{font-family:var(--font-num);font-weight:700;text-align:right;white-space:nowrap}
  /* width:100% makes the chips column soak up whatever the other columns don't need */
  .adm-table td.chips{padding-top:8px;padding-bottom:8px;width:100%;min-width:300px}
  /* one chapter per line, colour bars stacked — now that the column is wide, each
     chapter's chips fit on a single row instead of wrapping into a tall block */
  .rclusters{display:flex;flex-direction:column;gap:8px}
  .rcluster{border-left:3px solid var(--cc,var(--line));padding-left:8px}
  .rcluster.archived{opacity:.62}
  .rch-head{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--cc,var(--muted));margin-bottom:3px;white-space:nowrap}
  .rch-ico{font-size:12px}
  .rgrid{display:flex;flex-wrap:wrap;gap:3px;max-width:100%}
  .rchip{display:inline-grid;place-items:center;min-width:24px;height:19px;padding:0 4px;border-radius:6px;font-size:9.5px;font-weight:800;color:#fff;cursor:default}
  .rchip.ok{background:#16a34a}
  .rchip.try{background:#f59e0b;color:#3a2a00}
  .rchip.none{background:#e7e8ef;color:#9aa3b2}
  /* narrow screens (phone, split window): back to the old single-column stack */
  @media (max-width:1000px){ .view.adm{max-width:840px} }
</style>
</head>
<body>
  <div id="admin"><main class="view"><p class="muted center" style="padding:48px 0">Laai…</p></main></div>
  <script type="module" src="js/admin.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloaded) return; reloaded = true; location.reload();
      });
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
      });
    }
  </script>
</body>
</html>
